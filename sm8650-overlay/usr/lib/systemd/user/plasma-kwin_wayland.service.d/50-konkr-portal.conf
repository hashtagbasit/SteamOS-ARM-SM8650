# Steam's on-screen keyboard types with XTest into Xwayland; KWin forwards that
# to Wayland apps through the RemoteDesktop portal (xdg-desktop-portal-kde).
# Switching from Game Mode, xdg-desktop-portal is re-activated at session start
# while the user manager still has XDG_CURRENT_DESKTOP=gamescope, so it never
# loads the KDE backend: no RemoteDesktop, and the OSK only reaches X11 windows.
# Restart it once KWin is up and the environment says KDE.
[Service]
# --no-block: the portal waits on KWin, which is still starting here.
ExecStartPost=-/usr/bin/systemctl --user --no-block try-restart xdg-desktop-portal.service
